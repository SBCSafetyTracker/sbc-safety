<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SBC Safety</title>
<meta name="theme-color" content="#4f5a12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;background:#f6f5ec}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<script src="store.js"></script>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: fixed side menu on laptop, top bar + bottom tabs on phone; reports render as an A4 paper sheet identical to the PDF. */
:root{
  --ground:#f6f5ec; --surface:#ffffff; --tint:#eef0d6; --line:#e3e0c8; --line-strong:#c9c39a;
  --ink:#1d2014; --muted:#5b5f4c; --brand:#4f5a12; --brand-ink:#ffffff; --brand-soft:#e8e2b8; --gold:#c9a227; --gold-ink:#1d2014;
  --ok-bg:#e6efd2; --ok:#3b4a0c; --warn-bg:#fff4e0; --warn:#7a4a06; --bad-bg:#fde7e4; --bad:#8f1d12; --info-bg:#e3eaf6; --info:#1d3b6e;
  --paper:#ffffff; --paper-ink:#1d2014; --paper-line:#c9c39a; --paper-tint:#eef0d6; --paper-brand:#3c450c; --paper-muted:#5b5f4c; --ph:#e9e7d6;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#14160d; --surface:#1e2115; --tint:#2a3013; --line:#33372a; --line-strong:#4a4f37;
  --ink:#ecebdc; --muted:#a9ab95; --brand:#5d6a18; --brand-ink:#ffffff; --brand-soft:#e3dcae; --gold:#d4b13c; --gold-ink:#1d2014;
  --ok-bg:#25331a; --ok:#c4dc8f; --warn-bg:#3a2c10; --warn:#f2c46b; --bad-bg:#3f1c18; --bad:#f4a397; --info-bg:#1c2a40; --info:#a9c4ef; --ph:#2b2e22;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#14160d; --surface:#1e2115; --tint:#2a3013; --line:#33372a; --line-strong:#4a4f37;
  --ink:#ecebdc; --muted:#a9ab95; --brand:#5d6a18; --brand-ink:#ffffff; --brand-soft:#e3dcae; --gold:#d4b13c; --gold-ink:#1d2014;
  --ok-bg:#25331a; --ok:#c4dc8f; --warn-bg:#3a2c10; --warn:#f2c46b; --bad-bg:#3f1c18; --bad:#f4a397; --info-bg:#1c2a40; --info:#a9c4ef; --ph:#2b2e22;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.shell{display:flex;min-height:100%}
.side{width:248px;flex:none;background:var(--brand);color:var(--brand-ink);display:flex;flex-direction:column;gap:4px;padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brandblock{padding:4px 10px 20px;border-bottom:1px solid rgba(255,255,255,.18);margin-bottom:10px}
.brandblock b{display:block;font-size:19px;font-weight:700;letter-spacing:.2px}
.brandblock span{font-size:13px;color:var(--brand-soft)}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:9px;color:var(--brand-ink);text-decoration:none;font-size:15px;background:none;border:0;width:100%;text-align:left;cursor:pointer;min-height:44px}
.nav:hover{background:rgba(255,255,255,.1)}
.nav[aria-current="page"]{background:var(--gold);color:var(--gold-ink);font-weight:600}
.nav svg{flex:none}
.nav .chev{margin-left:auto;font-size:13px;opacity:.85}
.moregroup{display:flex;flex-direction:column;gap:2px;margin:2px 0 4px;padding-left:14px;border-left:2px solid rgba(255,255,255,.18);margin-left:20px}
.nav.sub{min-height:38px;padding:8px 10px;font-size:14px}
.side .who{margin-top:auto;border-top:1px solid rgba(255,255,255,.18);padding:14px 10px 0;font-size:13px}
.side .who span{color:var(--brand-soft);display:block}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.pagehead{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;padding-block:18px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.pagehead h1{font-size:23px;font-weight:600}
.pagehead p{margin:2px 0 0;color:var(--muted);font-size:14px}
.content{padding-block:22px 40px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;max-width:1240px;width:100%}
.tabbar{display:none}

@media (max-width:820px){
  .side{display:none}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
  .topbar{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--brand);color:var(--brand-ink);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  .topbar b{font-size:17px}
  .topbar small{display:block;color:var(--brand-soft);font-size:12px}
  .pagehead{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
  .pagehead h1{font-size:20px}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px;gap:16px}
  .tabbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;font-size:12px;color:var(--muted);background:none;border:0;cursor:pointer}
  .tab[aria-current="page"]{color:var(--brand);font-weight:600}
  .tab.cam span.c{width:62px;height:62px;border-radius:31px;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;margin-top:-30px;border:4px solid var(--surface);box-shadow:0 2px 6px rgba(30,30,10,.25)}
  .tab.cam{color:var(--brand);font-weight:600}
}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;font-size:15px;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:default}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--tint);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;min-height:38px;padding:0 14px;cursor:pointer;font-size:14px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);font-weight:600}
.topbar .seg{background:rgba(0,0,0,.2)}
.topbar .seg button{color:var(--brand-ink);min-height:34px;padding:0 10px;font-size:13px}
.topbar .seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;cursor:pointer;color:var(--ink)}
.tile .n{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.tile .l{font-size:13px;color:var(--muted)}
.tile.warn{background:var(--warn-bg);border-color:transparent}.tile.warn .l,.tile.warn .n{color:var(--warn)}
.tile.bad{background:var(--bad-bg);border-color:transparent}.tile.bad .l,.tile.bad .n{color:var(--bad)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.panel>header{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:12px 18px;background:var(--tint)}
.panel>header h2{font-size:16px;font-weight:600}
.panel .body{padding:16px 18px}
.empty{padding:22px 18px;color:var(--muted);font-size:14px}
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer;color:var(--ink)}
.rows .row:first-child{border-top:0}
.row:hover{background:var(--tint)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.row .t small{color:var(--muted);font-size:13px}
.thumb{width:64px;height:64px;border-radius:9px;object-fit:cover;background:var(--ph);flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.plain{background:var(--tint);color:var(--ink)}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;align-items:start}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;color:var(--ink);display:flex;flex-direction:column}
.ocard .ph{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;background:var(--line)}
.ocard .ph.one{grid-template-columns:1fr}
.ocard .meta{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.ocard .meta .top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 15px;border-radius:21px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-size:14px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.walk .chip[aria-pressed="true"]::before{content:"✓ "}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide{grid-column:1/-1}
.field label,.field .lab{font-size:14px;font-weight:500}
.field small{color:var(--muted);font-size:12px}
.in{min-height:46px;border:1px solid var(--line-strong);border-radius:9px;padding:0 12px;background:var(--surface);width:100%}
textarea.in{padding:10px 12px;min-height:96px;resize:vertical}
.sugwrap{position:relative}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:30;background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.18);max-height:260px;overflow:auto;padding:4px}
.sug button{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;min-height:42px;padding:0 10px;border:0;border-radius:7px;background:none;color:var(--ink);font:inherit;cursor:pointer}
.sug button:hover,.sug button[aria-selected="true"]{background:var(--tint)}
.sug button small{color:var(--muted);font-size:12px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 14px}
.checks label{display:flex;gap:10px;align-items:flex-start;min-height:36px;font-weight:400;font-size:14px}
.checks input{width:20px;height:20px;margin-top:1px;accent-color:var(--brand)}
.photos{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.photos .p{position:relative}
.photos img{width:92px;height:92px;object-fit:cover;border-radius:9px;background:var(--ph)}
.photos .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:14px;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.bigcam{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:180px;border:2px dashed var(--line-strong);border-radius:16px;background:var(--surface);color:var(--brand);font-weight:600;position:relative;overflow:hidden;cursor:pointer}
.bigcam input{position:absolute;inset:0;opacity:0;cursor:pointer}
button.bigcam{width:100%;font:inherit;font-weight:600}
button.bigcam svg,button.bigcam span,button.bigcam small{position:relative;z-index:1}
button.bigcam img+svg,button.bigcam img~span,button.bigcam img~small{display:none}
.bigcam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bigcam small{color:var(--muted);font-weight:400}
.sticky-save{position:sticky;bottom:0;background:var(--ground);padding-block:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:820px){.form{grid-template-columns:1fr}.sticky-save{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}

.banner{border-radius:10px;padding:10px 14px;font-size:14px;background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--info-bg);color:var(--info)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:12px 18px;border-radius:10px;z-index:50;font-size:14px;max-width:min(520px,calc(100% - 32px))}
@media (max-width:820px){.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}}
.tablewrap{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:10px 14px}
table.list td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
table.list tr.click{cursor:pointer}table.list tr.click:hover td{background:var(--tint)}
.num{font-variant-numeric:tabular-nums}

/* Paper sheet: identical on screen and in the PDF */
.sheetwrap{display:block;overflow-x:auto}
@media (max-width:820px){.desk-only{display:none}}
.sheet{width:794px;max-width:none;margin:0 auto;background:var(--paper);color:var(--paper-ink);box-shadow:0 1px 4px rgba(30,30,10,.2);padding:38px 42px;display:flex;flex-direction:column;gap:16px;font-size:13px;line-height:1.45}
.sheet.wide{width:1060px}
.sheet .sh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px;padding-bottom:10px;border-bottom:3px solid var(--paper-brand)}
.sheet .sh .addr{display:flex;flex-direction:column;line-height:1.45}
.sheet .sh .addr b{margin-bottom:3px}
.sheet .sh b{display:block;font-size:22px;color:var(--paper-brand);font-weight:700}
.sheet .sh span{font-size:12px;color:var(--paper-muted)}
.sheet .sh .doc{text-align:right;font-size:11.5px;color:var(--paper-muted);line-height:1.6;font-family:var(--mono)}
.sheet h3.title{text-align:center;font-size:18px;letter-spacing:.6px;font-weight:700}
.sheet .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--paper-line)}
.sheet .kv div{padding:8px 10px;border-bottom:1px solid var(--paper-line);border-right:1px solid var(--paper-line);overflow-wrap:anywhere}
.sheet .kv div:nth-child(2n){border-right:0}
.sheet .kv span{color:var(--paper-muted)}
.sheet .sec{font-size:13.5px;font-weight:700;color:var(--paper-brand);background:var(--paper-tint);padding:5px 10px}
.sheet ol,.sheet ul{margin:0;padding-left:24px}
.sheet table{width:100%;border-collapse:collapse;font-size:12.5px}
.sheet th{background:var(--paper-tint);text-align:left}
.sheet th,.sheet td{border:1px solid var(--paper-line);padding:6px 8px;vertical-align:top;overflow-wrap:anywhere}.sheet th{overflow-wrap:normal}.sheet table.fix{table-layout:fixed}.sheet td.nw{white-space:nowrap}
.sheet .pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sheet .pgrid img{width:100%;height:150px;object-fit:cover;background:var(--ph);display:block}
.sheet td img{width:118px;height:84px;object-fit:cover;display:block;background:var(--ph)}
.sheet .noph{width:118px;height:84px;border:1px dashed var(--paper-line);display:flex;align-items:center;justify-content:center;color:var(--paper-muted);font-size:11px}
.sheet .sign{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px;padding-top:34px}
.sheet .sign div{border-top:1px solid var(--paper-ink);padding-top:6px}
.sheet .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--paper-line);text-align:center}
.sheet .stats div{padding:8px;border-right:1px solid var(--paper-line)}.sheet .stats div:last-child{border-right:0}
.sheet .stats b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.sheet .stats span{font-size:11px;color:var(--paper-muted)}
.sheet .foot{font-size:10.5px;color:var(--paper-muted);text-align:right}
.morelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mtile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left;color:var(--ink);min-height:96px}
.mtile .ic{width:38px;height:38px;border-radius:10px;background:var(--tint);color:var(--brand);display:flex;align-items:center;justify-content:center}
.mtile b{font-size:14px}
.mtile small{color:var(--muted);font-size:12px}
.hidden-sr{position:absolute;left:-9999px}

/* fire extinguisher cards */
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
@media (max-width:820px){.xgrid{grid-template-columns:1fr}}
.xcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.xcard.bad{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.xph{position:relative;display:block;height:190px;border:0;padding:0;background:var(--ph);cursor:pointer;width:100%}
.xph img{width:100%;height:100%;object-fit:cover;display:block}
.xph .noimg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:100%;color:var(--muted)}
.xbody{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.xtop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.xid{display:block;font-size:18px;font-family:var(--mono)}
.xloc{color:var(--muted);font-size:13.5px}
.xdates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;border-top:1px solid var(--line);padding-top:10px}
.xdates div{display:flex;flex-direction:column;gap:1px;min-width:0}
.xdates span{font-size:12px;color:var(--muted)}.xdates b{font-weight:600;font-size:14px}
.xdates .pill{align-self:flex-start;margin-top:2px}
.xticks{display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--line);padding-top:10px}
.xt{font-size:13px;color:var(--muted)}.xt.on{color:var(--ok)}.xt.off{color:var(--bad);font-weight:600}
.xfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.xfoot small{color:var(--muted)}.xfoot .due{color:var(--warn)}
.xcheck{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:10px}
.xcheck .in{margin:6px 0}

/* original document viewer */
.dvwrap{max-width:900px;width:100%;margin:0 auto}

function compress(file){
  return new Promise(function(res,rej){
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=function(){
      const max=1600;let w=img.naturalWidth,hh=img.naturalHeight;const sc=Math.min(1,max/Math.max(w,hh));w=Math.round(w*sc);hh=Math.round(hh*sc);
      const c=document.createElement('canvas');c.width=w;c.height=hh;c.getContext('2d').drawImage(img,0,0,w,hh);URL.revokeObjectURL(url);
      c.toBlob(function(b){b?res(b):rej(new Error('compress'));},'image/jpeg',0.8);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('That file is not a photo the app can read.'));};
    img.src=url;
  });
}

let flushing=false;
async function flushQueue(){
  if(flushing||!S.queue.length||S.demo||!S.db||!navigator.onLine)return;
  flushing=true;
  try{
    while(S.queue.length){
      const q=S.queue[0];const body=q.body;
      if(q.photoData&&!body.photo){body.photo=await uploadPhoto(await dataURLToBlob(q.photoData));}
      if(q.afterData&&!body.afterPhoto){body.afterPhoto=await uploadPhoto(await dataURLToBlob(q.afterData));}
      await S.db.collection('obs').doc(q.id).set(body);
      S.queue.shift();saveQueue();
    }
    toast('Saved observations have been sent.');
  }catch(e){}
  flushing=false;softRender();
}
window.addEventListener('online',function(){flushQueue();softRender();});
window.addEventListener('offline',function(){softRender();});
setInterval(flushQueue,30000);

/* ---------- rendering ---------- */
let raf=0;
function render(){cancelAnimationFrame(raf);raf=requestAnimationFrame(paint);}
function softRender(){if(S.form||(S.dirtyView&&S.dirtyView===S.view)){S.pending=true;return;}render();}
function paint(){
  const app=document.getElementById('app');
  const r=myRole().role;
  if(S.needLogin){app.innerHTML=loginView();return;}
  if(S.ready&&r==='none'){app.innerHTML=noAccess();return;}
  if(S.ready&&(S.askName||S.renaming)){app.innerHTML=askNameView();paintToast();const mi=document.getElementById('myname');if(mi){mi.focus();mi.addEventListener('keydown',function(e){if(e.key==='Enter')saveMyName();});}return;}
  if(!allowedUnits().some(function(u){return u.id===S.unit;})&&allowedUnits()[0])S.unit=allowedUnits()[0].id;
  const v=S.view;
  app.innerHTML='<div class="shell">'+side()+'<div class="main">'+topbar()+viewHtml(v)+'</div></div>'+tabbar();
  paintToast();fitSheets();afterPaint();
  if(v==='settings')wireSettings();
}

    list('ext').forEach(function(e){if(extCond(e)==='Needs attention')out.push({go:'recView',col:'ext',id:e.id,title:'Extinguisher '+(e.tag||''),sub:e.location||'',pill:'<span class="pill bad">Needs attention</span>',rank:1});});
    list('ext').forEach(function(e){const d=daysTo(e.hptDue);if(d!=null&&d<=30)out.push({go:'recView',col:'ext',id:e.id,title:'Extinguisher '+(e.tag||'')+' – hydro test',sub:e.location||'',pill:duePill(e.hptDue),rank:d<0?0:2});});
    (function(){const ex=list('ext');const left=ex.filter(function(e){return !extCheckedThisMonth(e);}).length;if(ex.length&&left&&new Date().getDate()>=20)out.push({go:'recList',col:'ext',title:left+' extinguisher'+(left>1?'s':'')+' not checked this month',sub:'Monthly check',pill:'<span class="pill warn">Check</span>',rank:2});})();

/* videos: the stored file may come back without a video type, so give it one before playing */
const vidWait={};
function videoUrl(id,mime){
  S.vurl=S.vurl||{};
  if(S.vurl[id])return Promise.resolve(S.vurl[id]);
  if(vidWait[id])return vidWait[id];
  vidWait[id]=(async function(){
    let u=S.blobs[id];
    if(!u){if(window.SBCStore&&S.db){u=await window.SBCStore.photo(id);S.blobs[id]=u;}else throw new Error('missing');}
    const b=await (await fetch(u)).blob();
    const t=/^video\//.test(b.type)?b.type:(mime||'video/webm');
    S.vurl[id]=URL.createObjectURL(b.type===t?b:new Blob([b],{type:t}));return S.vurl[id];
  })();
  vidWait[id].catch(function(){setTimeout(function(){delete vidWait[id];},30000);});
  return vidWait[id];
}
/* QR codes on printed reports – library is loaded once from the CDN and then kept for offline use */
let qrLib=null;
function qrSrc(url){S.qr=S.qr||{};return S.qr[url]||'data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==';}
function fillQr(){
  const els=Array.prototype.slice.call(document.querySelectorAll('img[data-qr]'));
  if(!els.length)return Promise.resolve();
  if(!window.qrcode&&S.qrFail&&Date.now()-S.qrFail<60000){qrFallback(els);return Promise.resolve();}
  const QR_SRC='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
  if(!window.qrcode&&!qrLib){const old=document.querySelector('script[src="'+QR_SRC+'"]');if(old)old.remove();qrLib=loadScript(QR_SRC);}
  return (window.qrcode?Promise.resolve():qrLib).then(function(){
    if(!window.qrcode)throw new Error('qr');
    S.qr=S.qr||{};
    els.forEach(function(el){const url=el.dataset.qr;try{if(!S.qr[url]){const q=window.qrcode(0,'M');q.addData(url);q.make();S.qr[url]=q.createDataURL(4,2);}el.src=S.qr[url];}catch(e){}});
  }).catch(function(){qrLib=null;S.qrFail=Date.now();qrFallback(els);});
}
function qrFallback(els){els.forEach(function(el){const s=document.createElement('span');s.className='qrfail';s.textContent='QR code appears when online';el.replaceWith(s);});}
function afterPaint(){

/* ---- preparing files picked on the phone ---- */
function seekTo(v,t){return new Promise(function(res){const tm=setTimeout(res,3000);v.onseeked=function(){clearTimeout(tm);res();};try{v.currentTime=t;}catch(e){clearTimeout(tm);res();}});}
function frameJpeg(v,max){
  const vw=v.videoWidth||640,vh=v.videoHeight||360;const sc=Math.min(1,max/Math.max(vw,vh));
  const c=document.createElement('canvas');c.width=Math.max(2,Math.round(vw*sc));c.height=Math.max(2,Math.round(vh*sc));
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  return new Promise(function(res,rej){c.toBlob(function(b){b?res(b):rej(new Error('poster'));},'image/jpeg',0.85);});
}
function pickMime(){if(!window.MediaRecorder||!MediaRecorder.isTypeSupported)return '';const l=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];for(let i=0;i<l.length;i++){try{if(MediaRecorder.isTypeSupported(l[i]))return l[i];}catch(e){}}return '';}
/* shrink a short clip: 640 px, silent, ~0.65 Mbit/s, plus a still frame for printing */
function processVideo(file,onProg){
  return new Promise(function(res,rej){
    const url=URL.createObjectURL(file);const v=document.createElement('video');
    v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');v.setAttribute('muted','');v.preload='auto';
    let done=false;
    function finish(fn,val){if(done)return;done=true;URL.revokeObjectURL(url);fn(val);}
    function raw(poster,dur){if(file.size<=MAX_RAW_VIDEO)finish(res,{blob:file,mime:file.type||'video/mp4',poster:poster,dur:dur});else finish(rej,new Error('This phone cannot shrink the video. Use a clip under 10 MB.'));}
    v.onerror=function(){finish(rej,new Error('This video cannot be read here. Try a short clip recorded with the phone camera.'));};
    v.onloadedmetadata=async function(){
      const dur=v.duration;
      if(isFinite(dur)&&dur>MAX_VIDEO_SEC+1){finish(rej,new Error('Keep videos to '+MAX_VIDEO_SEC+' seconds or less. Trim it in the phone gallery first.'));return;}
      await seekTo(v,Math.min(0.3,isFinite(dur)?dur/3:0.3));
      let poster;try{poster=await frameJpeg(v,1280);}catch(e){finish(rej,new Error('Could not read a frame from this video.'));return;}
      const vw=v.videoWidth||640,vh=v.videoHeight||360;const sc=Math.min(1,640/Math.max(vw,vh));
      const w=Math.max(2,Math.round(vw*sc/2)*2),hh=Math.max(2,Math.round(vh*sc/2)*2);
      const c=document.createElement('canvas');c.width=w;c.height=hh;const g=c.getContext('2d');
      const mime=pickMime();
      if(!mime||!c.captureStream){raw(poster,dur);return;}
      await seekTo(v,0);
      let rec;try{rec=new MediaRecorder(c.captureStream(20),{mimeType:mime,videoBitsPerSecond:650000});}catch(e){raw(poster,dur);return;}
      const chunks=[];
      rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);};
      rec.onstop=function(){
        const b=new Blob(chunks,{type:mime.split(';')[0]});
        if(!b.size){raw(poster,dur);return;}
        if(b.size>file.size&&file.size<=MAX_RAW_VIDEO)finish(res,{blob:file,mime:file.type||'video/mp4',poster:poster,dur:dur});
        else finish(res,{blob:b,mime:mime.split(';')[0],poster:poster,dur:dur});
      };
      const stopT=setTimeout(function(){try{rec.stop();}catch(e){}},((isFinite(dur)?dur:MAX_VIDEO_SEC)*2+15)*1000);
      function draw(){
        if(rec.state!=='recording')return;g.drawImage(v,0,0,w,hh);
        if(onProg&&isFinite(dur)&&dur>0)onProg(Math.min(99,Math.round(100*v.currentTime/dur)));
        if(v.ended)return;if(v.requestVideoFrameCallback)v.requestVideoFrameCallback(draw);else requestAnimationFrame(draw);
      }
      v.onended=function(){try{g.drawImage(v,0,0,w,hh);}catch(e){}setTimeout(function(){clearTimeout(stopT);try{rec.stop();}catch(e){}},150);};
      rec.start(1000);
      try{await v.play();}catch(e){clearTimeout(stopT);rec.onstop=null;try{rec.stop();}catch(x){}raw(poster,dur);return;}
      draw();
    };
    v.src=url;
  });
}
function isVideoFile(f){return /^video\//.test(f.type||'')||/\.(mp4|webm|mov|3gp|mkv|m4v)$/i.test(f.name||'');}
function newKey(){return 'm'+Math.random().toString(36).slice(2,9);}
function setBusy(holder,msg){holder.busy=msg;const b=document.querySelector('[data-busy]');if(b){b.textContent=msg;b.hidden=!msg;}}
async function readFiles(files,holder){
  const out=[];
  for(const file of files){
    try{
      if(isVideoFile(file)){
        setBusy(holder,'Preparing video… keep this screen open.');
        const r=await processVideo(file,function(p){setBusy(holder,'Preparing video… '+p+'%');});
        out.push({key:newKey(),type:'video',blob:r.blob,mime:r.mime,dur:r.dur,posterBlob:r.poster,posterPreview:URL.createObjectURL(r.poster)});
      }else{
        setBusy(holder,'Adding photo…');
        const b=await compress(file);out.push({key:newKey(),type:'image',blob:b,preview:URL.createObjectURL(b)});
      }
    }catch(err){toast(err.message||'Could not add that file.');}
  }
  setBusy(holder,'');return out;
}
async function idSrc(id){
  if(S.blobs[id])return S.blobs[id];
  if(window.SBCStore&&S.db){const u=await window.SBCStore.photo(id);S.blobs[id]=u;return u;}
  throw new Error('The photo is not on this device yet. Try again when online.');

function origUrl(m){return m.type==='video'?(m.posterPreview||photoUrl(m.poster)):(m.preview||photoUrl(m.id));}
async function origSrc(m){return m.type==='video'?(m.posterPreview||await idSrc(m.poster)):(m.preview||await idSrc(m.id));}
/* draw the highlight ring into a copy of the photo, so it prints and shares exactly as seen */
function burnMark(src,mk){
  return new Promise(function(res,rej){
    const img=new Image();
    img.onload=function(){
      const max=1600;let w=img.naturalWidth,hh=img.naturalHeight;const sc=Math.min(1,max/Math.max(w,hh));w=Math.round(w*sc);hh=Math.round(hh*sc);
      const c=document.createElement('canvas');c.width=w;c.height=hh;const g=c.getContext('2d');g.drawImage(img,0,0,w,hh);
      const r=mk.r*w,lw=Math.max(4,w*0.009);
      g.beginPath();g.arc(mk.x*w,mk.y*hh,r,0,Math.PI*2);g.lineWidth=lw+Math.max(3,lw*0.8);g.strokeStyle='#ffffff';g.stroke();
      g.beginPath();g.arc(mk.x*w,mk.y*hh,r,0,Math.PI*2);g.lineWidth=lw;g.strokeStyle='#e11d1d';g.stroke();
      c.toBlob(function(b){b?res(b):rej(new Error('mark'));},'image/jpeg',0.85);
    };
    img.onerror=function(){rej(new Error('That photo could not be opened for highlighting.'));};
    img.src=src;
  });
}
/* upload new files (offline-safe: kept on the phone until sent) and return what is stored on the record */
async function persistMedia(items){
  const out=[];
  for(const m of items){
    const r={type:m.type==='video'?'video':'image'};
    if(r.type==='video'){
      if(!m.id)m.id=await uploadPhoto(m.blob);
      if(!m.poster)m.poster=await uploadPhoto(m.posterBlob);
      r.id=m.id;r.poster=m.poster;r.mime=m.mime||'video/webm';if(m.dur)r.dur=Math.round(m.dur*10)/10;
    }else{if(!m.id)m.id=await uploadPhoto(m.blob);r.id=m.id;}
    if(m.mark){
      r.mark={x:+(+m.mark.x).toFixed(4),y:+(+m.mark.y).toFixed(4),r:+(+m.mark.r).toFixed(4)};
      if(!m.view||m.markDirty){m.view=await uploadPhoto(await burnMark(await origSrc(m),r.mark));m.markDirty=false;}
      r.view=m.view;
    }
    out.push(r);
  }
  return out;
}

/* ---------- AI wording (Gemini key kept on this device only) ---------- */
function gemKey(){try{return localStorage.getItem('sbc_gemkey')||'';}catch(e){return '';}}
async function aiText(prompt){
  if(S.sample){const r=await S.sample(prompt,{modelTier:'quick'});return r.text||'';}
  const key=gemKey();if(!key){const e=new Error('nokey');throw e;}
  let last=null;
  for(const m of ['gemini-flash-latest','gemini-2.5-flash','gemini-2.0-flash']){
    const ac=new AbortController();const tm=setTimeout(function(){ac.abort();},30000);let res;
    try{res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.2,responseMimeType:'application/json'}}),signal:ac.signal});}catch(e){clearTimeout(tm);throw new Error(e&&e.name==='AbortError'?'slow':'net');}clearTimeout(tm);
    if(res.status===404){last=new Error('model');continue;}
    if(!res.ok){const e=new Error(res.status===400||res.status===403?'badkey':'net');throw e;}
    const j=await res.json();return ((((j.candidates||[])[0]||{}).content||{}).parts||[]).map(function(p){return p.text||'';}).join('');
  }
  throw last||new Error('net');
}
async function aiWording(o){
  const prompt='You help the safety manager of an aluminium die casting factory write observation reports. The rough note below may be Tamil, English or mixed, with spelling mistakes. Rewrite it as clear, professional English for a safety observation report (one to three short sentences). Keep every fact. Do not add names, numbers, places or details that are not given. Then write a short practical corrective action. Also give a 2-4 word issue label. Reply ONLY as JSON: {"observation":"...","action":"...","label":"..."}\n\nDepartment: '+(o.dept||'')+'\nType: '+(o.kind||'')+'\nRough note: '+(o.note||'')+(o.action?'\nRough action: '+o.action:'');

}

async function obsClick(t,e){
  const a=t.dataset.act;if(!a)return false;
  const f=S.form;
  switch(a){
    case 'addmedia':case 'pickgal':case 'pickcam':pickFile({multiple:true,accept:'image/*,video/*'},function(fs){addCapFiles(fs);});return true;
    case 'rmmedia':readCapture();f.media.splice(+t.dataset.i,1);render();return true;
    case 'markmedia':{readCapture();const i=+t.dataset.i;const m=f.media[i];if(!m)return true;f.markIdx=i;f.markDraft=m.mark?Object.assign({},m.mark):null;render();window.scrollTo(0,0);return true;}
    case 'markset':{const img=t.querySelector('img');if(!img)return true;const r=img.getBoundingClientRect();const x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;if(!(x>=0&&x<=1&&y>=0&&y<=1))return true;f.markDraft={x:x,y:y,r:(f.markDraft&&f.markDraft.r)||f.markSize||0.1};render();return true;}
    case 'marksize':f.markSize=+t.dataset.s;if(f.markDraft)f.markDraft.r=f.markSize;render();return true;
    case 'markclear':f.markDraft=null;render();return true;
    case 'markdone':{const m=f.media[f.markIdx];if(m){m.mark=f.markDraft||null;m.markDirty=true;if(!m.mark)delete m.view;}f.markIdx=null;f.markDraft=null;render();return true;}
    case 'markcancel':f.markIdx=null;f.markDraft=null;render();return true;
    case 'capcancel':{const id=f&&f.editId;S.form=null;go('obsDetail',{id:id});return true;}
    case 'obsedit':startEdit(t.dataset.id);return true;
    case 'obsfix':fixSaved(t.dataset.id,t);return true;
    case 'gemtest':gemSaveTest(t);return true;
    case 'fixall':fixAllRecent(t);return true;
    case 'mprev':stepMedia(t.dataset.side,-1);return true;
    case 'mnext':stepMedia(t.dataset.side,1);return true;
    case 'mjump':stepMedia(t.dataset.side,0,+t.dataset.i);return true;
    case 'lightbox':S.lb=t.dataset.side;render();return true;
    case 'lbclose':S.lb=null;render();return true;
    case 'oprev':moveObs(-1);return true;
    case 'onext':moveObs(1);return true;
    case 'dmode':S.obsDetailMode=t.dataset.m;try{localStorage.setItem('sbc_obsdmode',S.obsDetailMode);}catch(err){}render();return true;
    case 'addafter':case 'pickafter':case 'pickaftergal':{const oid=t.dataset.id;pickFile({multiple:true,accept:'image/*,video/*'},function(fs){addAfterFiles(fs,oid);});return true;}
    case 'rmafter':if(S.after){S.after.media.splice(+t.dataset.i,1);keepCloseNote(render);}return true;
  }
  return false;
}

function compItems(cat,uid){

/* status of one item: na / expired / due / missing / ok */
function compState(it,d){
  if(d&&d.na)return {s:'na',pill:'<span class="pill plain">Not applicable</span>',rank:9};
  const soft=!!(d&&d.docs&&d.docs.length)||(it.link&&linkCount(it.link)>0);const hard=!!(d&&d.hard);
  const dd=d&&d.expiry?daysTo(d.expiry):null;
  if(dd!=null&&dd<0)return {s:'expired',pill:'<span class="pill bad">Expired '+fmtD(d.expiry)+'</span>',rank:0,soft:soft,hard:hard};
  if(dd!=null&&dd<=30)return {s:'due',pill:'<span class="pill '+(dd<=20?'bad':'warn')+'">Due in '+dd+' day'+(dd===1?'':'s')+'</span>',rank:1,soft:soft,hard:hard};
  if(!soft||!hard)return {s:'missing',pill:'<span class="pill warn">'+(!soft&&!hard?'Not collected':!soft?'Scan missing':'Hard copy not filed')+'</span>',rank:2,soft:soft,hard:hard};
  return {s:'ok',pill:'<span class="pill ok">'+(d&&d.expiry?'Valid till '+fmtD(d.expiry):'Complete')+'</span>',rank:3,soft:soft,hard:hard};
}
function compSummary(uid){
  let tot=0,done=0,exp=0,due=0;
  COMP_CATS.forEach(function(c){compItems(c,uid).forEach(function(it){const st=compState(it,compDoc(it.k,uid));if(st.s==='na')return;tot++;if(st.s==='ok')done++;if(st.s==='expired')exp++;if(st.s==='due')due++;});});

async function compAddDocs(files){
  const f=S.form;if(!f||f.kind!=='comp')return;readComp();
  for(const file of files){
    try{
      if(/pdf/i.test(file.type)||/\.pdf$/i.test(file.name||'')){
        if(file.size>8*1024*1024){toast('That PDF is over 8 MB. Scan it at a lower quality and try again.');continue;}
        setBusy(f,'Adding '+(file.name||'PDF')+'…');
        f.draft.docs.push({type:'pdf',mime:'application/pdf',name:file.name||'Document.pdf',blob:file});
      }else{
        setBusy(f,'Adding photo…');const b=await compress(file);f.draft.docs.push({type:'image',mime:'image/jpeg',name:file.name||'Scan',blob:b,preview:URL.createObjectURL(b)});
      }
    }catch(err){toast(err.message||'Could not add that file.');}
  }
  setBusy(f,'');if(S.form===f){readComp();render();}
}
async function compSave(){
  readComp();const f=S.form;const d=f.draft;
  if(f.busy){toast('Wait until the scan is added.');return;}
  if(d.issued&&d.expiry&&d.expiry<d.issued){toast('The due date is before the issue date.');return;}
  const b=document.getElementById('compsave');if(b){b.disabled=true;b.textContent='Saving…';}
  try{
    const docs=[];
    for(const dc of d.docs){if(!dc.id)dc.id=await uploadPhoto(dc.blob);docs.push({id:dc.id,type:dc.type,mime:dc.mime,name:dc.name});}
    const body={};Object.keys(d).forEach(function(k){if(k!=='docs')body[k]=d[k];});
    body.docs=docs;body.unit=d.unit||S.unit;body.updatedAt=new Date().toISOString();body.by=S.uid||'';
    await writeDoc('comp',compKey(body.unit,f.k),body);
    S.form=null;toast('Saved.');go('comp');
  }catch(e){toast('Could not save. Try again.');if(b){b.disabled=false;b.textContent='Save';}}
}

function applyContacts(st){
  document.querySelectorAll('[data-ct]').forEach(function(el){const p=el.dataset.ct.split('|');const u=st.units[+p[0]];const d=u&&u.depts[+p[1]];if(!d)return;u.contacts=u.contacts||{};u.contacts[d]=u.contacts[d]||{};u.contacts[d][p[2]]=el.value.trim();});
  const dm=document.getElementById('s_dirmail');if(dm)st.dirMail=dm.value.trim();const dmo=document.getElementById('s_dirmob');if(dmo)st.dirMob=dmo.value.trim();
  const renames=[],rm={};let added=0,skipped=0,removed=0;
  document.querySelectorAll('[data-dn]').forEach(function(el){const p=el.dataset.dn.split('|');const u=st.units[+p[0]];const di=+p[1];const old=u&&u.depts[di];const nw=el.value.trim();if(!old||nw===old)return;
    if(!nw){(rm[+p[0]]=rm[+p[0]]||[]).push(di);return;}
    if(u.depts.indexOf(nw)>=0){skipped++;return;}
    u.depts[di]=nw;u.contacts=u.contacts||{};if(u.contacts[old]){u.contacts[nw]=u.contacts[old];delete u.contacts[old];}
    if(u.zones)u.zones=u.zones.map(function(z){return z===old?nw:z;});renames.push({unit:u.id,old:old,nw:nw});});
  document.querySelectorAll('[data-dnew]').forEach(function(el){const ui=+el.dataset.dnew;const u=st.units[ui];const nw=el.value.trim();if(!u||!nw)return;
    if(u.depts.indexOf(nw)>=0){skipped++;return;}
    u.depts.push(nw);u.contacts=u.contacts||{};const c={};document.querySelectorAll('[data-ctn^="'+ui+'|"]').forEach(function(i){c[i.dataset.ctn.split('|')[1]]=i.value.trim();});u.contacts[nw]=c;added++;});
  Object.keys(rm).forEach(function(ui){const u=st.units[+ui];rm[ui].sort(function(a,b){return b-a;}).forEach(function(di){const d=u.depts[di];u.depts.splice(di,1);if(u.contacts)delete u.contacts[d];if(u.zones)u.zones=u.zones.filter(function(z){return z!==d;});removed++;});});
  return {renames:renames,added:added,skipped:skipped,removed:removed};
}

  if(g('s_sd')!==null){st.sendDaily=g('s_sd').trim();st.sendWeekly=g('s_sw').trim();}
  Object.keys(st.roles||{}).forEach(function(id){

  const btn=document.querySelector('[data-act="saveall"]');if(btn){btn.disabled=true;btn.textContent='Saving…';}
  await putSettings(st);
  let moved=0;

  render();
}

/* ---------- Responsible name suggestions (HOD / backup contacts + earlier observations) ---------- */
function ownerNames(){
  const by={};
  function add(n,dept){n=String(n||'').trim();if(!n)return;const k=n.toLowerCase();const e=by[k]||(by[k]={name:n,depts:[]});if(dept&&e.depts.indexOf(dept)<0)e.depts.push(dept);}
  (S.settings.units||[]).forEach(function(u){const cs=u.contacts||{};Object.keys(cs).forEach(function(dp){add(cs[dp].hod,dp);add(cs[dp].bk,dp);});});
  (S.data.obs||[]).forEach(function(o){add(o.owner,o.dept);});
  return Object.keys(by).map(function(k){return by[k];});
}
function ownerMatches(q){
  q=String(q||'').trim().toLowerCase();if(!q)return [];
  return ownerNames().filter(function(e){const n=e.name.toLowerCase();return n.indexOf(q)===0||n.split(/\s+/).some(function(w){return w.indexOf(q)===0;});})
    .sort(function(a,b){const pa=a.name.toLowerCase().indexOf(q)===0?0:1,pb=b.name.toLowerCase().indexOf(q)===0?0:1;return pa-pb||a.name.localeCompare(b.name);}).slice(0,8);
}

/* ---------- Repeat problems ---------- */
const STOP=('the and with near from not are was has had any all one two its out top end per via that this have has not for are was were been into onto over under area areas shop floor kept keep found seen observed safety unsafe condition act workers worker machine near miss without no').split(' ');
function words(s){return String(s||'').toLowerCase().replace(/[^a-z0-9 ]+/g,' ').split(/\s+/).filter(function(w){return w.length>=3&&STOP.indexOf(w)<0;});}
function sameIssue(a,b){
  const la=String(a.label||'').trim().toLowerCase(),lb=String(b.label||'').trim().toLowerCase();
  if(la&&lb)return la===lb||words(la).some(function(w){return words(lb).indexOf(w)>=0;});
  const wa=words((a.label||'')+' '+(a.note||'')),wb=words((b.label||'')+' '+(b.note||''));
  let n=0;wa.forEach(function(w){if(wb.indexOf(w)>=0)n++;});return n>=2;
}
function repeatsOf(o,days){
  days=days||90;const from=addDays(o.date||today(),-days),to=o.date||today();
  return (S.data.obs||[]).filter(function(r){return r.id!==o.id&&(r.unit||S.unit)===(o.unit||S.unit)&&r.dept===o.dept&&String(r.date||'')>=from&&String(r.date||'')<=to&&sameIssue(o,r);});
}
function repeatPill(o){const n=repeatsOf(o).length;return n?'<span class="pill info rep" title="Same issue reported before in '+h(o.dept)+'">Repeat ×'+(n+1)+'</span>':'';}
function repeatGroups(uids,days){
  const seen={};const out=[];
  (S.data.obs||[]).filter(function(o){return uids.indexOf(o.unit||S.unit)>=0&&String(o.date||'')>=addDays(today(),-(days||90));}).slice().sort(byNewest).forEach(function(o){
    if(seen[o.id])return;const reps=repeatsOf(o,days);if(!reps.length)return;reps.forEach(function(r){seen[r.id]=1;});seen[o.id]=1;
    out.push({o:o,n:reps.length+1,open:[o].concat(reps).filter(function(x){return x.status!=='Closed';}).length});
  });
  return out.sort(function(a,b){return b.n-a.n;});
}

/* ---------- Policies and EHS procedures: bulk import of PDFs named "<item key> - <title>.pdf" ---------- */
function compAllItems(){const out=[];COMP_CATS.forEach(function(c){compItems(c).forEach(function(it){out.push(it);});});return out;}
async function certImport(f){
  const m=/^cert-([A-Za-z0-9-]+)/.exec(f.name||'');if(!m)return null;
  const rows=(S.data.certs||[]).filter(function(r){return r.srcFile===m[1];});if(!rows.length)return 0;
  if(rows.every(function(r){return (r.docs||[]).some(function(d){return d.name===f.name;});}))return rows.length;
  const id=await uploadPhoto(f);const doc={id:id,type:'pdf',mime:'application/pdf',name:f.name.replace(/^cert-[A-Za-z0-9-]+\s*-\s*/,'')};
  for(const r of rows){const b=stripId(r);b.docs=(b.docs||[]).filter(function(d){return d.name!==doc.name;}).concat([doc]);b.updatedAt=new Date().toISOString();await writeDoc('certs',r.id,b);}
  return rows.length;
}
async function compImport(files){
  const all=compAllItems();let ok=0,skip=[];const groups={};let certN=0,certF=0;
  const rest=[];
  for(const f of files){if(/^cert-/i.test(f.name||'')){toast('Attaching '+f.name+'…');try{const n=await certImport(f);if(n){certN+=n;certF++;}else skip.push(f.name);}catch(e){skip.push(f.name);}}else rest.push(f);}
  files=rest;
  files.forEach(function(f){const m=/^([a-z0-9_]+)(?:@(u\d+))?\s*-\s*/i.exec(f.name||'');const it=m&&all.find(function(i){return i.k===m[1];});if(!it){skip.push(f.name);return;}const gk=it.k+'@'+(m[2]||S.unit);(groups[gk]=groups[gk]||[]).push(f);});
  const keys=Object.keys(groups);
  for(let i=0;i<keys.length;i++){
    const gk=keys[i];const k=gk.split('@')[0],uid=gk.split('@')[1];toast('Importing '+(i+1)+' of '+keys.length+'…');
    try{
      const d=compDoc(k,uid);const body=d?stripId(d):{unit:uid,cat:(compFind(k)||{cat:{}}).cat.id,key:k,docs:[],hard:false};
      body.docs=(body.docs||[]).slice();
      for(const f of groups[gk]){
        if(body.docs.some(function(x){return x.name===f.name;}))continue;
        if(f.size>8*1024*1024){skip.push(f.name+' (over 8 MB)');continue;}
        const isPdf=/pdf/i.test(f.type)||/\.pdf$/i.test(f.name);
        const blob=isPdf?f:await compress(f);
        body.docs.push({id:await uploadPhoto(blob),type:isPdf?'pdf':'image',mime:isPdf?'application/pdf':'image/jpeg',name:f.name});
      }
      body.updatedAt=new Date().toISOString();body.by=S.uid||'';
      await writeDoc('comp',compKey(uid,k),body);ok++;
    }catch(e){skip.push(k);}
  }
  toast((certF?certF+' certificate PDF'+(certF>1?'s':'')+' attached to '+certN+' equipment records. ':'')+'Imported into '+ok+' item'+(ok===1?'':'s')+(skip.length?'. Not matched: '+skip.slice(0,3).join(', ')+(skip.length>3?' and '+(skip.length-3)+' more':''):'.')+' Photos and files upload in the background – keep the app open a few minutes.');
  render();
}

function ppeBal(r,size){let n=size==null||size===''?ppeOpening(r):0;ppeMoves(r).forEach(function(m){if(size!=null&&(m.size||'')!==size)return;n+=(m.kind==='in'?1:-1)*(Number(m.qty)||0);});return n;}
function ppeTotal(r){let n=ppeOpening(r);ppeMoves(r).forEach(function(m){n+=(m.kind==='in'?1:-1)*(Number(m.qty)||0);});return n;}

/* ---------- Original document viewer (PDF pages drawn inside the app, works on phones too) ---------- */
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfjsP=null;const pdfCache={};
function pdfjs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  pdfjsP=pdfjsP||loadScript(PDFJS+'pdf.min.js').then(async function(){for(let i=0;i<50&&!window.pdfjsLib;i++)await new Promise(function(r){setTimeout(r,100);});if(!window.pdfjsLib)throw new Error('pdf.js');if(!window.pdfjsLib.GlobalWorkerOptions.workerSrc)window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';return window.pdfjsLib;});
  pdfjsP.catch(function(){pdfjsP=null;});return pdfjsP;
}
function isPdfDoc(d){return /pdf/i.test(d.mime||'')||d.type==='pdf'||/\.pdf$/i.test(d.name||'');}
function normTxt(t){return String(t||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
async function docUrl(d){return videoUrl(d.id,isPdfDoc(d)?'application/pdf':(d.mime||'image/jpeg'));}
function loadPdf(d){
  if(!pdfCache[d.id])pdfCache[d.id]=(async function(){const lib=await pdfjs();const u=await docUrl(d);const buf=await (await fetch(u)).arrayBuffer();const pdf=await lib.getDocument({data:buf}).promise;const texts=[];for(let i=1;i<=pdf.numPages;i++){try{const pg=await pdf.getPage(i);const tc=await pg.getTextContent();texts.push(normTxt(tc.items.map(function(it){return it.str;}).join(' ')));}catch(e){texts.push('');}}return {pdf:pdf,texts:texts};})();
  pdfCache[d.id].catch(function(){delete pdfCache[d.id];});
  return pdfCache[d.id];
}
/* draws the document into host; with find, starts with the page(s) that mention it */
async function renderDoc(host,d,find,all){
  host.innerHTML='<div class="dvmsg">Opening the original document…</div>';
  try{
    if(!isPdfDoc(d)){const u=await docUrl(d);host.innerHTML='<img class="dvimg" src="'+u+'" alt="'+h(d.name||'Document')+'">';return;}
    const r=await loadPdf(d);const n=r.pdf.numPages;
    let pages=[];const f=normTxt(find);
    if(f&&!all)r.texts.forEach(function(t,i){if(t.indexOf(f)>=0)pages.push(i+1);});
    const partial=pages.length&&pages.length<n;if(!pages.length)pages=Array.from({length:n},function(_,i){return i+1;});
    if(!host.isConnected)return;
    host.innerHTML='<div class="dvbar"><span>'+(partial?'Showing page '+pages.join(', ')+' of '+n+' – this item':n+' page'+(n>1?'s':''))+'</span>'+(partial?'<button type="button" class="btn small" data-act="dvall">Show all '+n+' pages</button>':'')+'</div>';
    const w=Math.max(280,host.clientWidth||600);const dpr=Math.min(2,window.devicePixelRatio||1);
    for(const p of pages){
      const pg=await r.pdf.getPage(p);const v1=pg.getViewport({scale:1});const sc=w/v1.width;const vp=pg.getViewport({scale:sc*dpr});
      const c=document.createElement('canvas');c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);c.style.width='100%';c.className='dvpage';c.setAttribute('aria-label','Page '+p);
      if(!host.isConnected)return;host.appendChild(c);
      await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    }
  }catch(e){try{console.warn('doc viewer',e);}catch(_){}host.innerHTML='<div class="dvmsg">The document could not be shown here'+(navigator.onLine?'':' – you are offline')+'. <button type="button" class="btn small" data-act="dvtab">Open in a new tab</button></div>';}
}

function openDocViewer(d,find){

  const o=document.createElement('div');o.id='docviewer';o.className='dvover';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-label',d.name||'Document');
  o.innerHTML='<div class="dvhead"><b>'+h(d.name||'Document')+'</b><div class="btnrow"><button type="button" class="btn small" data-act="dvtab">Open in new tab</button><button type="button" class="btn small primary" data-act="dvclose">Close</button></div></div><div class="dvbody"><div class="dvhost"></div></div>';
  document.body.appendChild(o);S.dvDoc={d:d,find:find};

});

function loadScript(src){return new Promise(function(res,rej){if(document.querySelector('script[src="'+src+'"]'))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error('load'));};document.head.appendChild(s);});}
async function makePdf(name,btn){
  const el=document.getElementById('sheet');if(!el||!S.dl)return;
  if(btn){btn.disabled=true;btn.lastChild.textContent='Making PDF…';}
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    await Promise.all(Object.keys(photoWait).map(function(k){return photoWait[k].catch(function(){});}));
    await fillQr();
    const z=el.style.zoom;el.style.zoom='';
    let canvas,cuts=[],domH=1;try{
      const er=el.getBoundingClientRect();domH=er.height||1;
      el.querySelectorAll('tr,.stats,.sec,.pgrid,.sign,h3.title,.sh,.kv,p,li,.pt,.foot,article > *').forEach(function(n){
        const r=n.getBoundingClientRect();if(!r.height)return;let head=null;
        if(n.tagName==='TR'&&n.parentNode&&n.parentNode.tagName==='TBODY'){const th=n.closest('table').querySelector('thead');if(th&&n.nextElementSibling){const hr=th.getBoundingClientRect();head=[hr.top-er.top,hr.bottom-er.top];}}
        cuts.push({y:r.bottom-er.top,head:head});
      });
      canvas=await window.html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,ignoreElements:function(n){return n.classList&&n.classList.contains('noprt');}});
    }finally{el.style.zoom=z;}
    const J=window.jspdf.jsPDF;const wide=el.classList.contains('wide');
    const pdf=new J({orientation:wide?'landscape':'portrait',unit:'pt',format:'a4'});
    const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),m=18;
    const iw=pw-2*m;const scale=iw/canvas.width;const pagePx=Math.floor((ph-2*m)/scale);
    /* break pages only between rows / blocks, and repeat the table header on the next page */
    const k=canvas.height/domH,H=canvas.height;
    cuts=cuts.map(function(c){return {y:Math.round(c.y*k),head:c.head?[Math.round(c.head[0]*k),Math.round(c.head[1]*k)]:null};}).sort(function(a,b){return a.y-b.y;});
    let y=0,first=true,prefix=null;
    while(y<H-2){
      const ph0=prefix?prefix[1]-prefix[0]:0;const avail=pagePx-ph0;let cut=Math.min(y+avail,H),next=null;
      if(y+avail<H){let best=null;for(const c of cuts){if(c.y>y+10&&c.y<=y+avail)best=c;}if(best&&best.y-y>=avail*0.25){cut=best.y;next=best.head;}}
      const body=cut-y;const c=document.createElement('canvas');c.width=canvas.width;c.height=ph0+body;
      const g=c.getContext('2d');g.fillStyle='#ffffff';g.fillRect(0,0,c.width,c.height);
      if(prefix)g.drawImage(canvas,0,prefix[0],canvas.width,ph0,0,0,canvas.width,ph0);
      g.drawImage(canvas,0,y,canvas.width,body,0,ph0,canvas.width,body);
      if(!first)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',0.9),'JPEG',m,m,iw,c.height*scale);first=false;y=cut;prefix=next;
    }
    await S.dl.save({filename:(name||'report')+'.pdf',data:pdf.output('blob')});
    toast('PDF saved. Print two copies from your PDF viewer.');
  }catch(e){if(e&&e.code==='declined'){}else if(e&&e.code==='unavailable'){S.dl=null;toast('Downloads are not available in this view.');}else toast('Could not make the PDF. Check the connection and try again.');}
  if(btn){btn.disabled=false;btn.lastChild.textContent='Download PDF';}
}

/* ---------- navigation + events ---------- */
function parentOf(v,arg){
  const col=arg&&arg.col;
  switch(v){
    case 'obsDetail':case 'capture':return {v:'obs'};
    case 'recView':case 'recForm':case 'repRegister':return col==='permits'?{v:'permits'}:{v:'recList',arg:{col:col}};
    case 'recList':return {v:'records'};
    case 'compItem':return {v:'comp'};
    case 'comp':case 'tcal':case 'zs':return {v:'records'};
    case 'ppeLog':return {v:'recList',arg:{col:'ppe'}};
    case 'zsForm':return {v:'zs'};
    case 'repDaily':case 'repWeekly':case 'repSummary':case 'rep2S':return {v:'reports'};
    case 'settings':case 'emergency':return {v:'more'};
  }
  return {v:'home'};
}
function navBack(){
  S.hist=S.hist||[];
  let t=S.hist.pop();
  while(t&&t.v===S.view&&JSON.stringify(t.arg||null)===JSON.stringify(S.arg||null))t=S.hist.pop();
  if(!t)t=parentOf(S.view,S.arg);
  S.navBack=true;
  if(t.v==='capture'||t.v==='compItem'||t.v==='recForm'||t.v==='zsForm')t=parentOf(t.v,t.arg);
  S.after=null;S.lb=null;S.form=null;
  go(t.v,t.arg||null);
}
function go(v,arg){
  S.hist=S.hist||[];
  if(!S.navBack&&S.view&&!(S.view===v&&JSON.stringify(S.arg||null)===JSON.stringify(arg||null))){
    const cur={v:S.view,arg:S.arg};const last=S.hist[S.hist.length-1];
    /* stepping between observations with Next/Prev or filling a form replaces, not stacks */
    if(!(last&&last.v===cur.v&&(cur.v==='obsDetail'||cur.v==='capture'||cur.v==='compItem')))S.hist.push(cur);
    else S.hist[S.hist.length-1]=cur;
    if(S.hist.length>40)S.hist.shift();
  }
  S.navBack=false;
  if(S.form&&v!=='recForm'&&v!=='capture'&&v!=='zsForm'&&v!=='compItem'){S.form=null;}
  if(v!=='capture')S.prev=v; S.view=v;S.arg=arg||null;S.confirmDel=null;
  if(S.pending){S.pending=false;}
  S.dirtyView=null;
  try{localStorage.setItem('sbc_view',JSON.stringify({v:v,arg:arg||null}));}catch(e){}
  render();window.scrollTo(0,0);
}

  if(a==='cancelform'){const f=S.form;S.form=null;if(f&&f.id)go('recView',{col:f.col,id:f.id});else go(f&&f.col==='permits'?'permits':'recList',{col:f?f.col:''});return;}
  if(a==='saverec')return saveRec();
  if(a==='rmphoto'){if(S.form.kind==='zs')readZs();else readRecForm();S.form.draft[t.dataset.k].splice(+t.dataset.i,1);const box=document.getElementById('ph_'+t.dataset.k);if(box)box.innerHTML=photosInner(t.dataset.k,S.form.draft[t.dataset.k]);return;}
  if(a==='permit'){const r=(S.data.permits||[]).find(function(x){return x.id===t.dataset.id;});if(!r)return;const b=stripId(r);b.status=t.dataset.s;if(b.status==='Approved'){b.approvedAt=new Date().toISOString();b.approvedBy=S.uid||'';}if(b.status==='Closed')b.closedAt=new Date().toISOString();try{await writeDoc('permits',r.id,b);toast('Permit '+b.status.toLowerCase()+'.');}catch(err){toast('Could not update the permit.');}return;}
  if(a==='pdf')return makePdf(t.dataset.name,t);
  if(a==='copytext'){const txt=t.dataset.text;try{await navigator.clipboard.writeText(txt);toast('Summary copied. Paste it into Gmail or WhatsApp.');}catch(err){toast('Copy is blocked here. Use the WhatsApp button instead.');}return;}
  if(a==='savesettings'||a==='saveall')return saveAllSettings();
  if(a==='addperson'){if(S.dirtyView==='settings')await saveAllSettings();const st=readRoles();st.roles=st.roles||{};st.roles[t.dataset.id]={role:'officer',units:[S.unit],depts:[]};await putSettings(st);toast('Added. Set the role, then tap Save all changes.');return;}
  if(a==='rmperson'){if(S.dirtyView==='settings')await saveAllSettings();const st=readRoles();delete st.roles[t.dataset.id];await putSettings(st);toast('Removed.');return;}
  if(a==='saveroles')return saveAllSettings();
  if(a==='backup')return backup();
  if(a==='togglemore'){S.moreOpen=!S.moreOpen;try{localStorage.setItem('sbc_more',S.moreOpen?'1':'0');}catch(err){}render();return;}
  if(a==='signout'){if(window.SBCStore)window.SBCStore.signOut();return;}
  if(a==='dorestore')return doRestore();
  if(a==='cancelrestore'){S.restore=null;render();return;}
});
/* File picking: one input that lives outside the re-rendered app, so a refresh while the picker is open cannot lose the photo */
let pickCb=null;
const picker=document.createElement('input');picker.type='file';picker.accept='image/*';picker.className='hidden-sr';picker.setAttribute('aria-hidden','true');picker.tabIndex=-1;
document.body.appendChild(picker);
picker.addEventListener('change',function(){const fs=Array.prototype.slice.call(picker.files||[]);const cb=pickCb;pickCb=null;picker.value='';if(fs.length&&cb)cb(fs);});
function pickFile(opt,cb){
  pickCb=cb;picker.multiple=!!opt.multiple;picker.accept=opt.accept||'image/*';
  if(opt.capture)picker.setAttribute('capture','environment');else picker.removeAttribute('capture');
  picker.value='';
  try{picker.click();}catch(err){toast('Photos cannot be picked in this view. Open the app in Chrome.');}
  setTimeout(function(){if(pickCb===cb&&document.hasFocus())pickHint();},1500);
}
function pickHint(){toast('If the camera or gallery did not open, allow Camera and Photos for Chrome in the phone settings, then try again.');}
function onCapFile(file){if(file)addCapFiles([file]);}
function onAfterFile(file,id){if(file)addAfterFiles([file],id);}
async function onPhotos(files,k){
  if(!S.form)return;if(S.form.kind==='zs')readZs();else readRecForm();
  const box=document.getElementById('ph_'+k);if(box){const s=document.createElement('span');s.className='pill warn';s.textContent='Uploading '+files.length+'…';box.appendChild(s);}
  for(const file of files){try{const b=await compress(file);const id=await uploadPhoto(b);S.form.draft[k]=(S.form.draft[k]||[]).concat([id]);}catch(err){toast(err&&err.code==='not_granted'?'Your role cannot add photos.':'A photo could not be added. Check the connection.');}}
  const box2=document.getElementById('ph_'+k);if(box2)box2.innerHTML=photosInner(k,S.form.draft[k]);
}
document.addEventListener('keydown',function(e){if(e.altKey&&e.key==='ArrowLeft'&&S.view!=='home'){e.preventDefault();navBack();return;}});
document.addEventListener('keydown',function(e){if(e.key==='Enter'){const tr=e.target.closest&&e.target.closest('tr[data-go]');if(tr)tr.click();}});
document.addEventListener('change',async function(e){
  const el=e.target;
  if(obsChange(el))return;
  if(el.id==='capnative'){const f0=el.files&&el.files[0];if(f0)onCapFile(f0);return;}
  if(el.id==='afternative'){const f1=el.files&&el.files[0];if(f1)onAfterFile(f1,el.dataset.id);return;}
  if(el.id==='capphoto'||el.id==='capgallery'){const file=el.files&&el.files[0];if(file)onCapFile(file);return;}
  if(el.id==='afterphoto'){const file=el.files&&el.files[0];if(file)onAfterFile(file,el.dataset.id);return;}
  if(el.dataset&&el.dataset.photok){
    const k=el.dataset.photok;const files=Array.prototype.slice.call(el.files||[]);if(!files.length)return;if(S.form.kind==='zs')readZs();else readRecForm();
    const box=document.getElementById('ph_'+k);if(box){const s=document.createElement('span');s.className='pill warn';s.textContent='Uploading '+files.length+'…';box.appendChild(s);}
    for(const file of files){try{const b=await compress(file);const id=await uploadPhoto(b);S.form.draft[k]=(S.form.draft[k]||[]).concat([id]);}catch(err){toast(err&&err.code==='not_granted'?'Your role cannot add photos.':'A photo could not be added. Check the connection.');}}
    const box2=document.getElementById('ph_'+k);if(box2)box2.innerHTML=photosInner(k,S.form.draft[k]);return;
  }
  if(el.id==='f_kind'&&S.form&&S.form.col==='permits'){readRecForm();S.form.draft.checks=[];render();return;}
  if((el.id==='f_kind'||el.id==='f_outcome')&&S.form&&(S.form.col==='visitors'||S.form.col==='firstaid')){readRecForm();render();return;}
  if(el.id==='f_item'&&S.form&&S.form.col==='ppe'){const std=PPE_STD.find(function(p){return p[0].toLowerCase()===el.value.trim().toLowerCase();});const sz=document.getElementById('f_sizes');if(std&&sz&&!sz.value)sz.value=std[1];return;}
  if(el.id==='deptf'){S.deptFilter=el.value;render();return;}
  if(el.id==='datef'){S.dateFilter=el.value;render();return;}
  if(el.id==='repdate'){S.repDate=el.value||today();render();return;}
  if(el.id==='regmonth'){S.regMonth=el.value||today().slice(0,7);render();return;}
  if(el.id==='restorefile'){const file=el.files&&el.files[0];if(!file)return;try{const json=JSON.parse(await file.text());let count=0;COLS.forEach(function(c){count+=((json.data||{})[c]||[]).length;});S.restore={json:json,name:file.name,count:count};render();}catch(err){toast('That file is not a Safety Tracker backup.');}return;}
});
async function toggleWalk(dept){
  const key=today()+'_'+S.unit;const w=(S.data.walks||[]).find(function(r){return r.id===key;});
  const done=(w&&w.done||[]).slice();const i=done.indexOf(dept);if(i>=0)done.splice(i,1);else done.push(dept);
  try{await writeDoc('walks',key,{unit:S.unit,date:today(),done:done,by:S.uid||''});if(S.demo||!S.db)render();}catch(e){toast('Could not save the walk.');}
}

/* ---------- boot ---------- */
async function boot(){
  try{const q=new URLSearchParams(location.search).get('o');if(q){localStorage.setItem('sbc_open',q);history.replaceState(null,'',location.pathname+location.hash);}}catch(e){}
  try{if(localStorage.getItem('sbc_day')!==today()){localStorage.setItem('sbc_day',today());localStorage.removeItem('sbc_view');}}catch(e){}
  try{const sv=JSON.parse(localStorage.getItem('sbc_view')||'null');if(sv&&sv.v&&['recForm','capture','compItem'].indexOf(sv.v)<0){S.view=sv.v;S.arg=sv.arg;}}catch(e){}
  if(S.view==='recView'&&!(S.arg&&S.arg.col&&REC[S.arg.col]))S.view='home';
  if((S.view==='recList'||S.view==='repRegister')&&!(S.arg&&REC[S.arg.col]))S.view='home';
  render();
  const st=window.SBCStore;
  if(!st||!st.configured){startDemo();return;}
  if(!st.token()){S.needLogin=true;S.ready=true;render();return;}
  st.onError(function(m){toast(m);});
  st.onStatus(function(s){if(s==='signin'){S.needLogin=true;render();}else if(!S.form&&S.view!=='settings')render();});
  const ok=await st.init();
  if(!ok){S.needLogin=true;S.ready=true;render();return;}
  try{const op=localStorage.getItem('sbc_open');if(op){localStorage.removeItem('sbc_open');S.obsOrder=null;S.view='obsDetail';S.arg={id:op};}}catch(e){}
  S.db=st.db;S.assets=st.assets;S.user=st.user;S.dl=st.dl;S.sample=null;
  try{const me=await S.user.me();S.uid=me.id;S.isOwner=me.isOwner;S.canEdit=me.canEdit;S.myName=me.name||'';}catch(e){}
  loadMyName();
  S.db.doc('config/settings').onSnapshot(function(snap){
    if(snap.exists){const d=snap.data();S.settings=Object.assign({},JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),JSON.parse(JSON.stringify(d)));}
    S.ready=true;softRender();
  },function(){S.ready=true;softRender();});
  COLS.forEach(function(col){
    S.db.collection(col).onSnapshot(function(snap){S.data[col]=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});softRender();},function(){});
  });
  setTimeout(function(){S.ready=true;softRender();},4000);
  flushQueue();
}
function startDemo(){S.demo=true;S.ready=true;loadMyName();render();}
boot();
})();
</script>
